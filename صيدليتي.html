<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f5c4d">
<title>صيدليتي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--g:#0f5c4d;--g2:#e3f1ec;--bg:#f6f8f7;--card:#fff;--tx:#17251f;--mu:#68776f;--bd:#dbe4e0;--red:#c8442f;--red2:#fbe9e5;--amb:#b7791f;--amb2:#fdf1d9}
@media(prefers-color-scheme:dark){:root{--g:#4fc3a1;--g2:#173b32;--bg:#101815;--card:#18231f;--tx:#e8f1ed;--mu:#93a49c;--bd:#2a3a34;--red:#ff8a73;--red2:#3d2420;--amb:#f0b95a;--amb2:#3a2f17}}
*{box-sizing:border-box;margin:0}
body{font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:84px}
header{background:var(--g);color:#fff;padding:22px 18px 18px;padding-top:max(22px,env(safe-area-inset-top))}
@media(prefers-color-scheme:dark){header{color:#07201a}}
h1{font-size:26px;font-weight:800}
header p{opacity:.85;font-size:14px;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 14px 4px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}
.st b{display:block;font-size:24px;font-weight:800}
.st span{font-size:12px;color:var(--mu)}
.st.w b{color:var(--amb)}.st.d b{color:var(--red)}
main{padding:10px 14px}
input,select{width:100%;font:inherit;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);margin-bottom:10px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--g);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:13px;color:var(--mu);display:block;margin-bottom:4px}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 16px;background:var(--g);color:#fff;cursor:pointer;width:100%}
@media(prefers-color-scheme:dark){.btn{color:#07201a}}
.item{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.top h3{font-size:17px;font-weight:700}
.meta{font-size:13px;color:var(--mu);margin-top:3px}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.tag.ok{background:var(--g2);color:var(--g)}.tag.low{background:var(--amb2);color:var(--amb)}.tag.exp{background:var(--red2);color:var(--red)}
.acts{display:flex;gap:8px;margin-top:10px;align-items:center}
.acts button{font:inherit;font-weight:700;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;padding:8px 14px;cursor:pointer}
.acts .sell{background:var(--g2);color:var(--g);border-color:transparent;flex:1}
.acts .del{color:var(--red)}
.empty{text-align:center;color:var(--mu);padding:40px 10px;line-height:1.8}
nav{position:fixed;bottom:0;inset-inline:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;font:inherit;font-weight:700;font-size:14px;padding:16px 4px;border:0;background:none;color:var(--mu);cursor:pointer}
nav button.on{color:var(--g);box-shadow:inset 0 3px 0 var(--g)}
.pg{display:none}.pg.on{display:block}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
</style>
</head>
<body>
<header><h1>صيدليتي</h1><p>قائمة الأدوية المتوفرة وإدارة المخزون</p></header>
<div class="stats">
  <div class="st"><b id="n1">0</b><span>إجمالي الأصناف</span></div>
  <div class="st w"><b id="n2">0</b><span>كمية قليلة</span></div>
  <div class="st d"><b id="n3">0</b><span>منتهي أو قريب</span></div>
</div>
<main>
  <section class="pg on" id="p1">
    <input id="q" type="search" placeholder="ابحث باسم الدواء أو التصنيف...">
    <div id="list"></div>
  </section>
  <section class="pg" id="p2">
    <label for="nm">اسم الدواء</label><input id="nm" placeholder="مثال: باراسيتامول 500 مجم">
    <label for="cat">التصنيف</label><input id="cat" list="cats" placeholder="مثال: مضادات حيوية"><datalist id="cats"><option>مسكنات وخافضات حرارة<option>مضادات حيوية<option>المعدة والجهاز الهضمي<option>السكري<option>الضغط والقلب<option>الجهاز التنفسي والحساسية<option>الأطفال<option>فيتامينات ومكملات<option>جلدية وجروح<option>العيون والأذن<option>مستلزمات</datalist>
    <label for="ty">النوع</label>
    <select id="ty"><option>أقراص</option><option>شراب</option><option>حقن</option><option>كريم / مرهم</option><option>قطرة</option><option>أخرى</option></select>
    <div class="row">
      <div><label for="qt">الكمية</label><input id="qt" type="number" inputmode="numeric" min="0" placeholder="0"></div>
      <div><label for="pr">السعر</label><input id="pr" type="number" inputmode="decimal" min="0" placeholder="0"></div>
    </div>
    <label for="ex">تاريخ الانتهاء</label><input id="ex" type="date">
    <button class="btn" id="add">حفظ الدواء</button>
  </section>
  <section class="pg" id="p3">
    <div id="alerts"></div>
  </section>
</main>
<nav>
  <button class="on" data-p="p1">الأدوية</button>
  <button data-p="p2">إضافة دواء</button>
  <button data-p="p3">التنبيهات</button>
</nav>
<div id="toast"></div>
<script>
const K='saydaliyati_v2',LOW=5,SOON=60;
let items=[];
try{items=JSON.parse(localStorage.getItem(K))||[]}catch(e){}
const SEED=[
["باراسيتامول 500 مجم","أقراص","مسكنات وخافضات حرارة",120],
["إيبوبروفين 400 مجم","أقراص","مسكنات وخافضات حرارة",80],
["ديكلوفيناك 50 مجم","أقراص","مسكنات وخافضات حرارة",3],
["أموكسيسيلين 500 مجم","كبسولات","مضادات حيوية",60],
["أموكسيسيلين/كلافولانيك 625 مجم","أقراص","مضادات حيوية",45],
["أزيثروميسين 500 مجم","أقراص","مضادات حيوية",30],
["سيبروفلوكساسين 500 مجم","أقراص","مضادات حيوية",4],
["ميترونيدازول 500 مجم","أقراص","مضادات حيوية",50],
["أوميبرازول 20 مجم","كبسولات","المعدة والجهاز الهضمي",90],
["رانيتيدين / فاموتيدين 20 مجم","أقراص","المعدة والجهاز الهضمي",40],
["أملاح الجفاف ORS","أكياس","المعدة والجهاز الهضمي",100],
["لوبيراميد 2 مجم","كبسولات","المعدة والجهاز الهضمي",25],
["ميتفورمين 500 مجم","أقراص","السكري",150],
["غليبنكلاميد 5 مجم","أقراص","السكري",70],
["إنسولين سريع المفعول","حقن","السكري",12],
["أملوديبين 5 مجم","أقراص","الضغط والقلب",110],
["أتينولول 50 مجم","أقراص","الضغط والقلب",65],
["لوسارتان 50 مجم","أقراص","الضغط والقلب",55],
["أسبرين 75 مجم","أقراص","الضغط والقلب",130],
["أتورفاستاتين 20 مجم","أقراص","الضغط والقلب",5],
["سالبيوتامول بخاخ","بخاخ","الجهاز التنفسي والحساسية",35],
["لوراتادين 10 مجم","أقراص","الجهاز التنفسي والحساسية",75],
["سيتريزين 10 مجم","أقراص","الجهاز التنفسي والحساسية",60],
["شراب سعال للأطفال","شراب","الجهاز التنفسي والحساسية",28],
["شراب باراسيتامول للأطفال","شراب","الأطفال",55],
["شراب أموكسيسيلين للأطفال","شراب","الأطفال",22],
["زنك شراب","شراب","الأطفال",30],
["فيتامين د3","كبسولات","فيتامينات ومكملات",85],
["فيتامين ج 1000 مجم","أقراص فوارة","فيتامينات ومكملات",95],
["حديد وحمض الفوليك","أقراص","فيتامينات ومكملات",70],
["كالسيوم + د3","أقراص","فيتامينات ومكملات",48],
["فيتامين ب المركب","أقراص","فيتامينات ومكملات",60],
["فوسيدين كريم","كريم / مرهم","جلدية وجروح",25],
["هيدروكورتيزون كريم 1%","كريم / مرهم","جلدية وجروح",18],
["كلوتريمازول كريم","كريم / مرهم","جلدية وجروح",32],
["بوفيدون اليود محلول","محلول","جلدية وجروح",40],
["قطرة عين مضاد حيوي","قطرة","العيون والأذن",20],
["قطرة أذن","قطرة","العيون والأذن",15],
["محلول ملح للأنف","قطرة","العيون والأذن",45],
["كمامات طبية (علبة)","أخرى","مستلزمات",60],
["شاش طبي","أخرى","مستلزمات",80],
["شريط فحص السكر","أخرى","مستلزمات",30]
];
let inited=false;try{inited=!!localStorage.getItem(K+'_init')}catch(e){}
if(!items.length&&!inited){
  const y=new Date().getFullYear();
  items=SEED.map((r,i)=>({id:i+1,nm:r[0],ty:r[1],cat:r[2],qt:r[3],pr:0,ex:(y+1+(i%2))+'-'+String(1+(i*5)%12).padStart(2,'0')+'-28'}));
  try{localStorage.setItem(K+'_init','1')}catch(e){}save();
}
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(items))}catch(e){}};
const days=d=>Math.ceil((new Date(d)-new Date().setHours(0,0,0,0))/864e5);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function status(m){const d=m.ex?days(m.ex):999;
  if(d<0)return['exp','منتهي الصلاحية'];
  if(d<=SOON)return['exp','ينتهي خلال '+d+' يوم'];
  if(m.qt<=LOW)return['low','كمية قليلة'];
  return['ok','متوفر']}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)}
function card(m){const[c,t]=status(m);
  return`<div class="item"><div class="top"><div><h3>${esc(m.nm)}</h3><div class="meta">${m.cat?esc(m.cat)+' • ':''}${esc(m.ty)}${m.pr?' • السعر: '+m.pr:''} • الكمية: ${m.qt}${m.ex?' • ينتهي: '+m.ex:''}</div></div><span class="tag ${c}">${t}</span></div>
  <div class="acts"><button class="sell" data-s="${m.id}" ${m.qt<1?'disabled':''}>بيع وحدة</button><button data-a="${m.id}">+ توريد</button><button class="del" data-d="${m.id}">حذف</button></div></div>`}
function render(){
  const q=$('q').value.trim().toLowerCase();
  const f=items.filter(m=>(m.nm+' '+(m.cat||'')).toLowerCase().includes(q));
  $('list').innerHTML=f.length?f.map(card).join(''):`<div class="empty">${items.length?'لا توجد نتائج':'لا توجد أدوية بعد.<br>اضغط «إضافة دواء» لتبدأ.'}</div>`;
  const al=items.filter(m=>status(m)[0]!=='ok');
  $('alerts').innerHTML=al.length?al.map(card).join(''):'<div class="empty">لا توجد تنبيهات. كل شيء على ما يرام.</div>';
  $('n1').textContent=items.length;
  $('n2').textContent=items.filter(m=>status(m)[0]==='low').length;
  $('n3').textContent=items.filter(m=>status(m)[0]==='exp').length;
}
function go(p){document.querySelectorAll('.pg').forEach(e=>e.classList.toggle('on',e.id===p));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));scrollTo(0,0)}
document.querySelector('nav').onclick=e=>{if(e.target.dataset.p)go(e.target.dataset.p)};
$('q').oninput=render;
$('add').onclick=()=>{
  const nm=$('nm').value.trim();
  if(!nm){toast('اكتب اسم الدواء');return}
  items.unshift({id:Date.now(),nm,cat:$('cat').value.trim(),ty:$('ty').value,qt:+$('qt').value||0,pr:+$('pr').value||0,ex:$('ex').value});
  save();['nm','cat','qt','pr','ex'].forEach(i=>$(i).value='');render();toast('تم حفظ الدواء');go('p1')};
document.body.addEventListener('click',e=>{
  const t=e.target,get=k=>items.find(m=>m.id==t.dataset[k]);
  if(t.dataset.s){const m=get('s');if(m&&m.qt>0){m.qt--;save();render();toast('تم البيع')}}
  else if(t.dataset.a){const m=get('a'),n=parseInt(prompt('كم وحدة وصلت؟'));if(m&&n>0){m.qt+=n;save();render();toast('تم التوريد')}}
  else if(t.dataset.d){const m=get('d');if(m&&confirm('حذف «'+m.nm+'»؟')){items=items.filter(x=>x!==m);save();render();toast('تم الحذف')}}
});
render();
</script>
</body>
</html>
